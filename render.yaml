services:
  - type: web
    name: voicedebt
    runtime: node
    plan: free
    buildCommand: echo "No build step"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_WHISPER_MODEL
        value: openai/whisper-large-v3
      - key: HF_GEMMA_MODEL
        value: google/gemma-3-12b-it
